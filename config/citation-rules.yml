version: "1.0"
citation_policy:
  general:
    - "اسم القانون"
    - "رقم القانون"
    - "سنة الإصدار"
    - "رقم المادة"
    - "مصدر النص أو مسار الملف"
  supreme_court:
    required:
      - "رقم المبدأ أو الحكم إن وجد"
      - "رقم القضية/الطعن إن وجد"
      - "السنة الهجرية أو الميلادية بحسب المصدر"
      - "تاريخ الجلسة إن كان موثقاً"
      - "مصدر النشر"
    rule: "لا تنسب مبدأً للمحكمة العليا دون مصدر موثق."
  online_sources:
    rule: "استخدم المصدر الرسمي متى كان متاحاً."
  repository_sources:
    rule: "يذكر مسار الملف داخل المستودع عند الاستناد إلى قاعدة المعرفة."
  uncertainty:
    rule: "إذا تعذر التحقق، صرّح بدرجة التحقق ولا تحول الاحتمال إلى حقيقة."

drafting:
  preferred_yemeni_judicial_phrases:
    - "وحيث أن"
    - "ومن حيث أن"
    - "وحيث إن"
    - "ومن ثم"
    - "وعليه"
  style:
    - "قضائية يمنية احترافية"
    - "مترابطة وسردية عند إعداد المذكرات والأحكام"
    - "دون حشو أو ادعاءات غير موثقة"

prohibitions:
  - "عدم اختلاق أرقام أحكام أو مبادئ."
  - "عدم اختلاق نصوص مواد."
  - "عدم استخدام قانون أجنبي بديلاً عن القانون اليمني عند طلب القانون اليمني."
  - "عدم الجزم بنفاذ نص قبل فحص التعديلات."
