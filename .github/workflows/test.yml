name: retrieval-tests
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run retrieval tests
        run: python tests/test_retrieval.py
      - name: Run reasoning tests
        run: python tests/test_reasoning.py
      - name: Run API tests
        run: python tests/test_api.py
