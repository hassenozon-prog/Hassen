name: retrieval-tests
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run retrieval tests
        run: python tests/test_retrieval.py
      - name: Run reasoning tests
        run: python tests/test_reasoning.py
      - name: Run API tests
        run: python tests/test_api.py
      - name: Run verification tests
        run: python tests/test_verification.py
      - name: Run drafting tests
        run: python tests/test_drafting.py
      - name: Run case engine tests
        run: python tests/test_case_engine.py
      - name: Run manifest tests
        run: python tests/test_manifest.py
      - name: Test legal index builder
        run: python tests/test_indexes.py
      - name: Validate legal indexes
        run: python tools/rebuild_indexes.py --check
      - name: Build corpus manifest
        run: python ingestion/corpus_manifest.py --output /tmp/corpus-manifest.json
